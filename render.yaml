services:
  - type: web
    name: elecciones-api
    env: node
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    healthCheckPath: /health
    
  - type: cron
    name: noticias-updater
    schedule: "0 */2 * * *" # Cada 2 horas
    buildCommand: npm install
    startCommand: curl -X POST https://elecciones202.onrender.com/force-update
    envVars:
      - key: NODE_ENV
        value: production 