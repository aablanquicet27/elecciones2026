
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis Electoral</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #7C3AED 0%, #A855F7 50%, #F59E0B 100%);
            color: white;
            height: 1080px;
            width: 1920px;
            padding: 60px;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 64px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header h2 {
            font-size: 32px;
            opacity: 0.9;
            font-weight: normal;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }
        .feature-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .feature-card h3 {
            font-size: 28px;
            margin-bottom: 15px;
        }
        .feature-card p {
            font-size: 18px;
            opacity: 0.9;
        }
        .candidates-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }
        .candidate-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .candidate-photo {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            margin: 0 auto 20px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: #F59E0B;
            border-radius: 4px;
        }
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        .chart-section {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .line-chart {
            width: 100%;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-top: 20px;
            position: relative;
        }
        .line-chart::after {
            content: '📈';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
        }
        .bar-chart {
            display: flex;
            align-items: end;
            height: 200px;
            gap: 15px;
            margin-top: 20px;
        }
        .bar {
            flex: 1;
            background: #F59E0B;
            border-radius: 5px 5px 0 0;
            min-height: 20px;
        }
        .year-badge {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 24px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="year-badge">2026</div>
    <div class="header">
        <h1>Análisis Electoral</h1>
        <h2>Gráficos y Tendencias</h2>
    </div>
    <div class="content">
        
        <div class="charts-container">
          <div class="chart-section">
            <h4>Evolución Histórica</h4>
            <div class="line-chart"></div>
          </div>
          <div class="chart-section">
            <h4>Intención por Regiones</h4>
            <div class="bar-chart">
              <div class="bar" style="height: 70%"></div>
              <div class="bar" style="height: 45%"></div>
              <div class="bar" style="height: 60%"></div>
              <div class="bar" style="height: 35%"></div>
              <div class="bar" style="height: 50%"></div>
            </div>
          </div>
        </div>
      
    </div>
</body>
</html>
