name: Build Android AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      
    - name: Install dependencies
      run: npm install
      
    - name: Build web app
      run: npm run build
      
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Create release keystore
      run: |
        mkdir -p android/app
        keytool -genkey -v -keystore android/app/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass elecciones2026 -keypass elecciones2026 -dname "CN=Elecciones Colombia 2026, OU=AgapaiApp, O=AgapaiApp, L=Bogota, ST=Cundinamarca, C=CO"
        
    - name: Configure signing
      run: |
        echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
        echo "MYAPP_UPLOAD_KEY_ALIAS=release" >> android/gradle.properties
        echo "MYAPP_UPLOAD_STORE_PASSWORD=elecciones2026" >> android/gradle.properties
        echo "MYAPP_UPLOAD_KEY_PASSWORD=elecciones2026" >> android/gradle.properties
        
    - name: Make gradlew executable
      run: chmod +x android/gradlew
      
    - name: Build signed AAB
      run: |
        cd android
        ./gradlew bundleRelease --no-daemon
        
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
